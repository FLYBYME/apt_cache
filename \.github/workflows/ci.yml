name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x']
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ '{{' }} matrix.node-version {{ '}}'}}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ '{{' }} matrix.node-version {{ '}}'}}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Upload coverage
        uses: codecov/codecov-action@v5
